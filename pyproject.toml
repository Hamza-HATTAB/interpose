[project]
name = "interpose"
version = "0.1.0"
description = "Deterministic Security Reference Monitor & Dynamic Taint Tracking for Autonomous Tool-Calling Agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Hamza HATTAB", email = "hhamzariadh@gmail.com" }
]
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
